{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Multiplayer Game - {{ room.code }}</title>
    <link rel="stylesheet" href="{% static 'game/css/main.css' %}">
<style>
#multiplayerModeBanner{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:140;background:rgba(0,0,0,.78);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:7px 12px;font:13px Arial;pointer-events:none;text-align:center}#multiplayerModeBanner small{display:block;color:#aaa;font-size:10px;margin-top:2px}#multiplayerEventBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;background:rgba(15,15,25,.92);border:1px solid rgba(255,255,255,.25);color:#fff;font:700 16px Arial;box-shadow:0 8px 30px rgba(0,0,0,.45);pointer-events:none}#multiplayerEventBanner .event-icon{font-size:25px}#multiplayerEventBanner small{display:block;font-size:10px;color:#aaa;margin-top:3px}#voiceChatPanel{position:fixed;top:10px;left:10px;z-index:150;display:flex;align-items:center;gap:6px}
#voiceChatBtn{border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(10,10,20,.78);color:#fff;padding:9px 12px;font-weight:bold;touch-action:manipulation}
#voiceStatus{color:#fff;font:12px Arial;background:rgba(0,0,0,.65);border-radius:8px;padding:6px 8px;min-height:14px}
@media(max-width:767px){
  #multiplayerModeBanner{top:4px;transform:translateX(-50%) scale(.72);transform-origin:top center;white-space:nowrap}
  #multiplayerEventBanner{top:48px;transform:translateX(-50%) scale(.78);transform-origin:top center;white-space:nowrap}
  #multiplayerHUD{top:8px!important;right:8px!important;transform:scale(.78);transform-origin:top right}
  #voiceChatPanel{top:8px;left:8px;transform:scale(.82);transform-origin:top left}
}
#stoneHUD{position:fixed;left:10px;bottom:10px;z-index:250;background:rgba(5,5,15,.9);color:#fff;padding:10px 12px;border:1px solid #8a6cff;border-radius:10px;font:11px Arial;line-height:1.35;pointer-events:none}#infinityGauntletBtn{position:fixed;right:18px;bottom:18px;z-index:260;width:64px;height:64px;border-radius:50%;border:2px solid #ffd700;background:radial-gradient(circle,#8b5cf6,#111);color:#ffd700;font-size:30px;box-shadow:0 0 20px #8b5cf6;cursor:pointer;touch-action:manipulation}#infinityGauntletBtn:disabled{opacity:.55;cursor:wait}.dust-burst{position:fixed;left:50%;top:50%;z-index:700;font-size:50px;color:#ddd;animation:dustBurst .8s ease-out forwards;pointer-events:none}@keyframes dustBurst{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.5);opacity:1}100%{transform:scale(3);opacity:0}}#stonePickupBanner{position:fixed;left:50%;top:35%;transform:translateX(-50%);z-index:650;padding:16px 25px;background:rgba(10,5,25,.95);border:2px solid #a78bfa;border-radius:15px;color:#fff;font:800 22px Arial;box-shadow:0 0 30px #7c3aed}@keyframes stoneSpin{from{transform:rotate(0deg) translateX(160px) rotate(0deg)}to{transform:rotate(360deg) translateX(160px) rotate(-360deg)}}#gauntletCutscene{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle,#24104d,#020207 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Arial;text-align:center}.gauntlet-title{font-size:30px;font-weight:900;letter-spacing:5px}.stone-orbit{font-size:80px;margin:70px;animation:stoneSpin 2s linear infinite}.gauntlet-text{font-size:20px}.gauntlet-final{font-size:44px;font-weight:1000;color:#ffd700;margin-top:20px;opacity:0;transform:scale(.3);transition:all 1s}.combine .stone-orbit{animation:none;transform:scale(.3);opacity:0;transition:all 1s}.combine .gauntlet-final{opacity:1;transform:scale(1.1);text-shadow:0 0 30px #ffd700}</style>
</head>
<body class="game-page">
    <div id="voiceChatPanel"><button id="voiceChatBtn" type="button">🎤 Voice</button><span id="voiceStatus"></span></div>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <div class="controls-overlay">
        <div id="joystick" class="joystick-area"></div>
        <div id="actionButtons" class="action-buttons"></div>
    </div>

    <!-- Multiplayer UI -->
    <div id="multiplayerHUD" style="position: fixed; top: 10px; right: 10px; z-index: 100;">
        <div style="background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; color: white; font-family: Arial;">
            <div style="font-size: 12px; color: #888;">Room: <span style="color: #4a90d9;">{{ room.code }}</span></div>
            <div style="font-size: 12px; color: #888;">Mode: <span style="color: {% if room.mode == 'pvp' %}#d94a4a{% else %}#4ad94a{% endif %};">{{ room.mode|upper }}</span></div>
            <div id="pingDisplay" style="font-size: 11px; color: #666;">Ping: --ms</div>
            <div id="playersHUD" style="margin-top: 8px; font-size: 12px;"></div>
        </div>
    </div>

    <!-- Hidden game data -->
    <script>
        window.PLAYER_PROFILE = {
            current_level: {{ profile.current_level }},
            max_level_reached: {{ profile.max_level_reached }},
            total_kills: {{ profile.total_kills }},
            total_deaths: {{ profile.total_deaths }},
            total_boss_kills: {{ profile.total_boss_kills }},
        };

        window.MULTIPLAYER_CONFIG = {
            roomCode: '{{ room.code }}',
            mode: '{{ room.mode }}',
            level: {{ room.level_number }},
            playerId: {{ request.user.id }},
            playerSlot: {{ player.player_slot }},
            username: '{{ request.user.username }}',
            isHost: {{ is_host|yesno:"true,false" }},
            maxPlayers: {{ room.max_players }},
            equippedClass: '{{ profile.equipped_class|default:"" }}'
        };
    </script>

    <script type="module">
        // Import multiplayer-enabled main
        import { initMultiplayerGame } from '{% static "game/js/multiplayer/MultiplayerMain.js" %}';

        // Initialize multiplayer game
        initMultiplayerGame(window.MULTIPLAYER_CONFIG);
    </script>
</body>
</html>
