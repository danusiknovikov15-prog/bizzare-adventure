{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer - Platformer Game</title>
    <link rel="stylesheet" href="{% static 'game/css/main.css' %}">
    <style>
        /* Multiplayer pages must be a normal scrollable page on phones.
           main.css is also used by the game canvas and disables body scrolling. */
        html {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100% !important;
            touch-action: pan-y !important;
        }

        body {
            width: 100% !important;
            height: auto !important;
            min-height: 100vh !important;
            min-height: 100dvh !important;
            position: static !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            touch-action: pan-y !important;
        }

        .multiplayer-container {
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: 50px;
        }
    </style>

    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .multiplayer-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(74, 144, 217, 0.5);
        }

        .menu-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #4a90d9;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a90d9, #357abd);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5aa0e9, #4589cd);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 144, 217, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-coop {
            background: linear-gradient(135deg, #4ad94a, #2d8a2d);
        }

        .btn-coop:hover {
            background: linear-gradient(135deg, #5ae95a, #3d9a3d);
        }

        .btn-pvp {
            background: linear-gradient(135deg, #d94a4a, #8a2d2d);
        }

        .btn-pvp:hover {
            background: linear-gradient(135deg, #e95a5a, #9a3d3d);
        }

        .mode-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .btn-mode { background:rgba(74,144,217,.22); color:white; border:1px solid rgba(74,144,217,.45); }
        .btn-mode:hover { background:rgba(74,144,217,.38); }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 15px;
            font-size: 1.1em;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            text-transform: uppercase;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            text-transform: none;
        }

        .rooms-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .room-info {
            flex: 1;
        }

        .room-code {
            font-weight: bold;
            color: #4a90d9;
        }

        .room-mode {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .mode-coop { background: #4ad94a; }
        .mode-pvp { background: #d94a4a; }

        .room-players {
            color: #aaa;
            font-size: 0.9em;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4a90d9;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px 8px 0 0;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.2);
            border-bottom: 2px solid #4a90d9;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(217, 74, 74, 0.3);
            border: 1px solid #d94a4a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
    
        .trade-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px; }
        .trade-grid label { display:block; color:#aaa; margin-bottom:6px; font-size:.9em; }
        .trade-grid select, .trade-grid input { width:100%; box-sizing:border-box; padding:10px; margin-bottom:8px; border-radius:7px; border:1px solid rgba(255,255,255,.2); background:#111827; color:#fff; }
        .trade-status { min-height:22px; margin:8px 0; text-align:center; }
        .trade-offer { background:rgba(0,0,0,.3); border-radius:8px; padding:10px; margin-top:8px; }
        .trade-offer button { margin-left:6px; padding:6px 9px; border:0; border-radius:5px; cursor:pointer; }
        @media (max-width:600px) { .mode-grid { grid-template-columns:1fr; gap:4px; } .trade-grid { grid-template-columns:1fr; gap:5px; } .multiplayer-container { padding:16px 10px; } .menu-section { padding:14px; margin-bottom:14px; } .title { font-size:2em; margin-bottom:24px; } .section-title { font-size:1.25em; margin-bottom:12px; } .btn { width:100%; margin:4px 0; padding:10px 14px; font-size:.95em; } .mode-buttons { flex-direction:column; gap:3px; } .input-group { flex-direction:column; gap:6px; } .input-group .btn { width:100%; } .tabs { gap:5px; overflow-x:auto; } .tab { padding:8px 12px; font-size:.9em; white-space:nowrap; } .room-item { padding:10px; } }

    </style>
</head>
<body>
    <div class="multiplayer-container">
        <h1 class="title">MULTIPLAYER</h1>

        <div id="errorMessage" class="error-message"></div>

        <!-- Create Room Section -->
        <div class="menu-section">
            <h2 class="section-title">Create Room</h2>
            <div class="mode-grid">
                <button class="btn btn-coop" onclick="createRoom('coop')">🤝 Co-op</button>
                <button class="btn btn-pvp" onclick="createRoom('pvp')">⚔️ PvP</button>
                <button class="btn btn-mode" onclick="createRoom('survival')">🧟 Survival</button>
                <button class="btn btn-mode" onclick="createRoom('bossrush')">👑 Boss Rush</button>
                <button class="btn btn-mode" onclick="createRoom('race')">🏁 Race</button>
                <button class="btn btn-mode" onclick="createRoom('kinghill')">🏔️ King of the Hill</button>
                <button class="btn btn-mode" onclick="createRoom('capture')">🚩 Capture Point</button>
                <button class="btn btn-mode" onclick="createRoom('escort')">🛡️ Escort</button>
                <button class="btn btn-mode" onclick="createRoom('treasure')">💎 Treasure Hunt</button>
                <button class="btn btn-mode" onclick="createRoom('infection')">🦠 Infection</button>
            </div>
        </div>

        <!-- Join Room Section -->
        <div class="menu-section">
            <h2 class="section-title">Join Room</h2>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('code')">By Code</button>
                <button class="tab" onclick="switchTab('user')">By Username</button>
                <button class="tab" onclick="switchTab('browse')">Browse</button>
            </div>

            <!-- Join by Code -->
            <div id="tabCode" class="tab-content active">
                <div class="input-group">
                    <input type="text" id="roomCodeInput" placeholder="Enter room code (e.g. ABC123)" maxlength="6">
                    <button class="btn btn-primary" onclick="joinByCode()">Join</button>
                </div>
            </div>

            <!-- Join by Username -->
            <div id="tabUser" class="tab-content">
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Enter username">
                    <button class="btn btn-primary" onclick="joinByUsername()">Find</button>
                </div>
            </div>

            <!-- Browse Rooms -->
            <div id="tabBrowse" class="tab-content">
                <div style="margin-bottom: 15px;">
                    <button class="btn btn-secondary" onclick="loadRooms('')">All</button>
                    <button class="btn btn-coop" onclick="loadRooms('coop')">Co-op</button>
                    <button class="btn btn-pvp" onclick="loadRooms('pvp')">PvP</button>
                </div>
                <div id="roomsList" class="rooms-list">
                    <p style="text-align: center; color: #888;">Click a filter to load rooms</p>
                </div>
            </div>
        </div>

        <!-- Quick Match -->
        <div class="menu-section">
            <h2 class="section-title">Quick Match</h2>
            <div class="mode-grid quick-mode-grid">
                <button class="btn btn-coop" onclick="quickMatch('coop')">🤝 Co-op</button>
                <button class="btn btn-pvp" onclick="quickMatch('pvp')">⚔️ PvP</button>
                <button class="btn btn-mode" onclick="quickMatch('survival')">🧟 Survival</button>
                <button class="btn btn-mode" onclick="quickMatch('bossrush')">👑 Boss Rush</button>
                <button class="btn btn-mode" onclick="quickMatch('race')">🏁 Race</button>
                <button class="btn btn-mode" onclick="quickMatch('kinghill')">🏔️ King Hill</button>
                <button class="btn btn-mode" onclick="quickMatch('capture')">🚩 Capture</button>
                <button class="btn btn-mode" onclick="quickMatch('escort')">🛡️ Escort</button>
                <button class="btn btn-mode" onclick="quickMatch('treasure')">💎 Treasure</button>
                <button class="btn btn-mode" onclick="quickMatch('infection')">🦠 Infection</button>
            </div>
        </div>


        <!-- Trading -->
        <div class="menu-section trade-section">
            <h2 class="section-title">🔄 Player Trading</h2>
            <p style="color:#aaa;margin-top:-10px;">Trade items with another player. Both players must own the requested items.</p>
            <div class="trade-grid">
                <div>
                    <label>Your item</label>
                    <select id="tradeOfferItem"></select>
                    <input id="tradeOfferQty" type="number" min="1" value="1" placeholder="Quantity">
                </div>
                <div>
                    <label>Other player's item</label>
                    <select id="tradeRequestItem"></select>
                    <input id="tradeRequestQty" type="number" min="1" value="1" placeholder="Quantity">
                </div>
            </div>
            <div class="input-group">
                <input id="tradeUsername" type="text" placeholder="Username to trade with">
                <button class="btn btn-primary" onclick="sendTradeOffer()">Send Trade</button>
            </div>
            <div id="tradeStatus" class="trade-status"></div>
            <div id="tradeIncoming"></div>
        </div>

        <a href="{% url 'game:index' %}" class="back-link">← Back to Menu</a>
    </div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <script>
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        }

        async function createRoom(mode) {
            showLoading(true);
            try {
                const response = await fetch('/api/room/create/', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ mode: mode, level: 1 })
                });

                // Django can return an HTML error/login page instead of JSON.
                // Read the body first so the user gets the real HTTP error.
                const raw = await response.text();
                let data;
                try {
                    data = JSON.parse(raw);
                } catch (_) {
                    const preview = raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 180);
                    throw new Error(`HTTP ${response.status} - Server returned HTML instead of JSON${preview ? ': ' + preview : ''}`);
                }

                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }

                if (data.success) {
                    window.location.href = `/multiplayer/lobby/${encodeURIComponent(data.room_code)}/`;
                } else {
                    showError(data.error || 'Failed to create room');
                }
            } catch (e) {
                console.error('[Multiplayer] createRoom failed:', e);
                showError(e.message || 'Network error');
            } finally {
                showLoading(false);
            }
        }

        async function joinByCode() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) {
                showError('Please enter a room code');
                return;
            }

            showLoading(true);
            try {
                const response = await fetch('/api/room/join/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ code })
                });
                const data = await response.json();

                if (data.success) {
                    window.location.href = `/multiplayer/lobby/${data.room_code}/`;
                } else {
                    showError(data.error || 'Failed to join room');
                }
            } catch (e) {
                showError('Network error: ' + e.message);
            }
            showLoading(false);
        }

        async function joinByUsername() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                showError('Please enter a username');
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(`/api/room/find-by-user/${username}/`);
                const data = await response.json();

                if (data.success && data.room) {
                    // Found room, now join it
                    const joinResponse = await fetch('/api/room/join/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code: data.room.code })
                    });
                    const joinData = await joinResponse.json();

                    if (joinData.success) {
                        window.location.href = `/multiplayer/lobby/${joinData.room_code}/`;
                    } else {
                        showError(joinData.error || 'Failed to join room');
                    }
                } else {
                    showError(data.error || 'User not found in any room');
                }
            } catch (e) {
                showError('Network error: ' + e.message);
            }
            showLoading(false);
        }

        async function loadRooms(mode) {
            showLoading(true);
            try {
                const url = mode ? `/api/rooms/?mode=${mode}` : '/api/rooms/';
                const response = await fetch(url);
                const data = await response.json();

                const container = document.getElementById('roomsList');

                if (data.success && data.rooms.length > 0) {
                    container.innerHTML = data.rooms.map(room => `
                        <div class="room-item">
                            <div class="room-info">
                                <span class="room-code">${room.code}</span>
                                <span class="room-mode mode-${room.mode}">${room.mode.toUpperCase()}</span>
                                <div class="room-players">${room.player_count}/${room.max_players} players • Level ${room.level} • Host: ${room.host}</div>
                            </div>
                            <button class="btn btn-primary" onclick="joinRoom('${room.code}')">Join</button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #888;">No rooms found</p>';
                }
            } catch (e) {
                showError('Failed to load rooms');
            }
            showLoading(false);
        }

        async function joinRoom(code) {
            showLoading(true);
            try {
                const response = await fetch('/api/room/join/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ code })
                });
                const data = await response.json();

                if (data.success) {
                    window.location.href = `/multiplayer/lobby/${data.room_code}/`;
                } else {
                    showError(data.error || 'Failed to join room');
                }
            } catch (e) {
                showError('Network error: ' + e.message);
            }
            showLoading(false);
        }

        async function quickMatch(mode) {
            showLoading(true);
            try {
                const response = await fetch('/api/room/quick-match/', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({mode})
                });
                const data = await response.json();
                if (data.success) window.location.href = '/multiplayer/lobby/' + data.room_code + '/';
                else showError(data.error || 'Quick Match failed');
            } catch(e) {
                showError('Network error: ' + e.message);
            } finally {
                showLoading(false);
            }
        }


        async function tradeFetch(url, options = {}) {
            const response = await fetch(url, options);
            return await response.json();
        }

        function tradeStatus(message, error = false) {
            const el = document.getElementById('tradeStatus');
            el.textContent = message;
            el.style.color = error ? '#ff7777' : '#70ff9a';
        }

        async function loadTradeInventory() {
            try {
                const data = await tradeFetch('/api/trades/inventory/');
                if (!data.success) return;
                const selects = [document.getElementById('tradeOfferItem'), document.getElementById('tradeRequestItem')];
                selects.forEach((select, index) => {
                    select.innerHTML = '';
                    data.items.forEach(item => {
                        const option = document.createElement('option');
                        option.value = JSON.stringify({type:item.type,id:item.id});
                        option.textContent = item.id + ' ×' + item.quantity;
                        select.appendChild(option);
                    });
                    if (!data.items.length) {
                        select.innerHTML = '<option value="">No items in inventory</option>';
                    }
                });
            } catch (e) {
                tradeStatus('Could not load inventory', true);
            }
        }

        async function sendTradeOffer() {
            const username = document.getElementById('tradeUsername').value.trim();
            const offered = document.getElementById('tradeOfferItem').value;
            const requested = document.getElementById('tradeRequestItem').value;
            if (!username || !offered || !requested) {
                tradeStatus('Choose a player and both items first.', true);
                return;
            }
            const a = JSON.parse(offered), b = JSON.parse(requested);
            const data = await tradeFetch('/api/trades/create/', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    username,
                    offered_item_type:a.type, offered_item_id:a.id,
                    offered_quantity:parseInt(document.getElementById('tradeOfferQty').value) || 1,
                    requested_item_type:b.type, requested_item_id:b.id,
                    requested_quantity:parseInt(document.getElementById('tradeRequestQty').value) || 1
                })
            });
            tradeStatus(data.success ? '✅ Trade offer sent!' : '❌ ' + data.error, !data.success);
            loadTradeOffers();
        }

        async function tradeAction(id, action) {
            const data = await tradeFetch('/api/trades/' + id + '/' + action + '/', {method:'POST'});
            tradeStatus(data.success ? 'Trade updated.' : '❌ ' + data.error, !data.success);
            loadTradeOffers();
            loadTradeInventory();
        }

        async function loadTradeOffers() {
            try {
                const data = await tradeFetch('/api/trades/');
                const box = document.getElementById('tradeIncoming');
                if (!data.success) return;
                box.innerHTML = '<h3 style="margin-bottom:8px;">Incoming offers</h3>';
                if (!data.incoming.length) {
                    box.innerHTML += '<div style="color:#888;">No pending offers.</div>';
                } else {
                    data.incoming.forEach(o => {
                        const row = document.createElement('div');
                        row.className = 'trade-offer';
                        row.innerHTML = '<b>' + o.from + '</b> offers <b>' + o.offered.id + ' ×' + o.offered.quantity +
                            '</b> for your <b>' + o.requested.id + ' ×' + o.requested.quantity +
                            '</b> <button onclick="tradeAction(' + o.id + ',\'accept\')">Accept</button>' +
                            '<button onclick="tradeAction(' + o.id + ',\'reject\')">Reject</button>';
                        box.appendChild(row);
                    });
                }
            } catch (e) {}
        }

        loadTradeInventory();
        loadTradeOffers();
        setInterval(loadTradeOffers, 3000);

        // Enter key support
        document.getElementById('roomCodeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinByCode();
        });
        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinByUsername();
        });
    </script>
</body>
</html>
