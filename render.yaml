databases:
  - name: bizzare-adventure-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: bizzare-adventure
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bizzare-adventure-db
          property: connectionString
